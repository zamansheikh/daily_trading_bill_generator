# Builds the Windows release and the Inno Setup installer on a Windows runner.
# Trigger: push a tag like v1.0.0, or run it by hand from the Actions tab.
# The installer is attached as a workflow artifact (and to the release for tags).
name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows release
        run: |
          flutter pub get
          flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\daily_trading_bill_generator.iss
          Get-ChildItem installer\output

      - uses: actions/upload-artifact@v4
        with:
          name: DailyTradingBillGenerator-windows-setup
          path: installer/output/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*.exe
